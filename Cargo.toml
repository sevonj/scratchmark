[package]
name = "scratchmark"
version = "1.9.1"
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_14"] }
sourceview5 = "0.11.2"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
regex = "1.12.2"
libspelling = "0.5.0"

[features]
# Search for data files in install locations instead of source tree.
installed = []
# For generating screenshots for packaging. Uses default window size and loads demo library. 
# Don't build a flatpak with this.
generatescreenshots = []

[build-dependencies]
glib-build-tools = "0.22.0"
